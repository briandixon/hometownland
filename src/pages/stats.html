<!--title: Traffic-->
<!--desc: Private traffic dashboard for gohometownland.com.-->
<!--nav: none-->
<!--robots: noindex, nofollow-->
<!--script: stats-->

<div class="pagehead"><div class="wrap">
  <div class="rule"></div>
  <h1>Traffic</h1>
  <p>Who visited, from where, and what they read. Bots and your own visits are left out.</p>
</div></div>

<section class="st">
  <div class="wrap">

    <form id="keyGate" class="keygate" hidden>
      <div class="fld">
        <label for="keyInput">Dashboard key</label>
        <input id="keyInput" type="password" autocomplete="current-password"
               placeholder="The TRAFFIC_KEY set on the Vercel project">
        <div class="msg" id="keyMsg">That key was not accepted.</div>
      </div>
      <button class="btn" type="submit">Show the numbers</button>
      <p class="note">Kept in this browser so you only type it once. Opening this page
        also marks the browser as yours, so your own visits are never counted.</p>
    </form>

    <p id="dashNote" class="dashnote" hidden></p>

    <div id="dash" hidden>

      <div class="st-head">
        <div class="st-period">
          <button class="st-back" type="button" id="backBtn" hidden></button>
          <div class="st-title">
            <button class="st-step" type="button" id="prevBtn" aria-label="The period before">&lsaquo;</button>
            <h2 id="periodTitle"></h2>
            <button class="st-step" type="button" id="nextBtn" aria-label="The period after">&rsaquo;</button>
          </div>
          <div class="st-sub" id="periodSub"></div>
        </div>

        <div class="st-pick">
          <div class="st-chips" id="chips" role="group" aria-label="Period">
            <button type="button" data-p="today">Today</button>
            <button type="button" data-p="yesterday">Yesterday</button>
            <button type="button" data-p="7">7 days</button>
            <button type="button" data-p="30">30 days</button>
            <button type="button" data-p="90">90 days</button>
            <button type="button" data-p="month">This month</button>
            <button type="button" data-p="lastmonth">Last month</button>
            <button type="button" data-p="custom" id="customChip">Dates&hellip;</button>
          </div>
          <form class="st-custom" id="customForm" hidden>
            <label>From <input type="date" id="fromDate" required></label>
            <label>To <input type="date" id="toDate" required></label>
            <button class="btn" type="submit">Show</button>
          </form>
        </div>
      </div>

      <div class="st-body" id="stBody">
        <div class="st-tiles" id="tiles"></div>

        <div class="st-card">
          <div class="st-card-h">
            <h3 id="chartHead">Visits per day</h3>
            <span class="st-hint" id="chartHint"></span>
          </div>
          <div class="st-chart" id="chart"></div>
          <div class="st-axis" id="axis"></div>
        </div>

        <div class="st-grid" id="breakdowns"></div>

        <div class="st-card">
          <div class="st-card-h st-log-h">
            <h3 id="visitsHead">Visits</h3>
            <div class="st-tools">
              <input type="search" id="filterInput" placeholder="Filter by town, state, source or page"
                     aria-label="Filter the visits">
              <button class="btn st-export" type="button" id="csvBtn">Export CSV</button>
            </div>
          </div>
          <div class="st-filter" id="filterChip" hidden></div>
          <div id="visitLog"></div>
        </div>

      </div>

      <div class="st-foot">
        <p id="excluded"></p>
        <p id="ownerNote"></p>
        <p class="st-foot-act">
          <button class="backlink" type="button" id="dailyCsvBtn">Daily totals (CSV)</button>
          <button class="backlink" type="button" id="forgetBtn">Forget key</button>
        </p>
        <p class="note" id="dashFoot"></p>
      </div>
    </div>

  </div>
</section>
